<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Book Library</title>
  <link rel="stylesheet" href="styles.css">
  <script src="script.js" defer></script>
</head>
<body>

  <header>
    <h1>📚 My Book Library</h1>
    <span>Track what you've read</span>
  </header>

  <div id="sidebar">
    <h2>Add a Book</h2>
    <button id="add-btn">Add +</button>

    <form id="book-form" class="off">
      <div>
        <label for="book-title">Title</label>
        <input type="text" id="book-title" placeholder="Book title" required>
      </div>
      <div>
        <label for="book-author">Author</label>
        <input type="text" id="book-author" placeholder="Author name" required>
      </div>
      <div>
        <label for="pages">Pages</label>
        <input type="number" id="pages" placeholder="e.g. 320" min="1">
      </div>
      <div>
        <label for="status">Already read?</label>
        <input type="checkbox" id="status">
      </div>
      <button type="submit">Add Book</button>
    </form>
</div>

  <main id="main-area">
    <h2>Your Collection</h2>
    <div id="book-grid">
      <p class="empty-state">No books yet — add your first one!</p>
    </div>
  </main>

</body>
</html>
